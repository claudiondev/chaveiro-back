# PostgreSQL local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chaveiro}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dev usa o Hibernate para criar/atualizar o schema, não o Flyway (bancos locais não têm
# flyway_schema_history). Com spring-boot-starter-flyway no classpath, o Flyway fica
# habilitado por padrão — sem isso aqui, ele tentaria recriar tabelas que já existem.
# As migrations reais são validadas contra PostgreSQL em PostgresFreshInstallIT/
# PostgresMigrationEvolutionIT (`mvn verify`), não no dev local.
spring.flyway.enabled=false

# JWT
jwt.secret=${JWT_SECRET:chave-secreta-dev-apenas-nao-usar-em-producao-32chars!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Servidor
server.port=${PORT:8080}
