# PostgreSQL real, para validar as migrations do Flyway de verdade (não roda no `mvn test` normal).
# PostgresMigrationIT cria/derruba o banco "chaveiro_it" antes de subir este contexto.
spring.datasource.url=jdbc:postgresql://${DB_IT_HOST:localhost}:${DB_IT_PORT:5432}/chaveiro_it
spring.datasource.username=${DB_IT_USERNAME:postgres}
spring.datasource.password=${DB_IT_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway aplica as migrations reais; Hibernate só valida que as entidades batem com o schema resultante
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=chave-secreta-teste-apenas-32-caracteres-minimo!!
jwt.expiration=86400000
