# H2 em memória para testes
spring.datasource.url=jdbc:h2:mem:chaveiro_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# O schema de teste e criado pelo Hibernate; migrations exigem teste de integracao com PostgreSQL real
spring.flyway.enabled=false

# JWT
jwt.secret=chave-secreta-teste-apenas-32-caracteres-minimo!!
jwt.expiration=86400000
